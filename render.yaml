services:
  - type: web
    name: sovereign-bridge
    runtime: python
    region: frankfurt
    plan: free
    
    buildCommand: |
      pip install -r requirements.txt
    
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - Key: GMAIL_EMAIL
        value: abouamhster@gmail.com  
      - key: GMAIL_APP_PASSWORD
        sync: true  
