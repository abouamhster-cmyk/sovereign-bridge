services:
  # =====================================================
  # BACKEND PRINCIPAL - API
  # =====================================================
  - type: web
    name: sovereign-bridge
    runtime: python
    region: frankfurt
    plan: free
    
    buildCommand: |
      pip install -r requirements.txt
    
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GMAIL_EMAIL
        value: abouamhster@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: true
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_USER_ID
        sync: false

  # =====================================================
  # WORKER KEEP-ALIVE - Pour empêcher Render de s'endormir
  # =====================================================
  - type: worker
    name: sovereign-keepalive
    runtime: python
    region: frankfurt
    plan: free
    
    buildCommand: |
      pip install requests
    
    startCommand: python keep_alive.py
    
    envVars:
      - key: BACKEND_URL
        value: https://sovereign-bridge.onrender.com
